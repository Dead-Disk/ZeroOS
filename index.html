<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroOS - Mobile Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Phone Frame & Component Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Window Manager Logic -->
    <script src="assets/js/windowManager.js"></script>
    <!-- Boot Sequence Logic -->
    <script src="assets/js/bootSequence.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-black text-zinc-100 h-screen w-screen flex items-center justify-center overflow-hidden select-none">

    <!-- Container Frame HP / Simulator Chassis -->
    <div class="phone-chassis" x-data="zeroOS">
        <!-- Speaker Earpiece (Atas Bezel) -->
        <div class="phone-earpiece"></div>

        <!-- Tombol Fisik Kanan (Volume & Power) -->
        <div class="hw-button hw-btn-volume" title="Volume Rocker"></div>
        <div class="hw-button hw-btn-power" title="Tombol Power" @click="currentScreen = (currentScreen === 'lockscreen' ? 'desktop' : 'lockscreen')"></div>

        <!-- Layar HP (Display Screen) -->
        <div class="phone-screen">
            
            <!-- Boot Sequence Overlay -->
            <div id="boot-overlay" class="boot-overlay" role="presentation" aria-label="ZeroOS Booting">
                <!-- Phase 1: Coded UI Splash Screen (Matching Figma) -->
                <div id="boot-splash" class="boot-splash">
                    <!-- Center Content: Bold white text "ZENIUZ" -->
                    <div class="boot-splash-center">
                        <span class="boot-splash-title">ZENIUZ</span>
                    </div>

                    <!-- Bottom Content: Powered by ZeroOS and Z logo -->
                    <div class="boot-splash-bottom">
                        <span class="boot-splash-powered">Powered by</span>
                        <div class="boot-splash-brand-row">
                            <span class="boot-splash-brand-name">ZeroOS</span>
                            <div class="boot-splash-logo-wrapper">
                                <img src="assets/boot/ZeroOS logo.png" alt="ZeroOS Logo" class="boot-splash-brand-logo">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Phase 2: Boot Animation Video -->
                <video id="boot-video" 
                       class="boot-video" 
                       muted 
                       playsinline 
                       preload="auto">
                    <source src="assets/boot/ZeroOS Boot.mp4" type="video/mp4">
                </video>
            </div>

            <!-- Kamera Depan (Punch-Hole) -->
            <div class="punch-hole-camera">
                <div class="punch-hole-lens"></div>
            </div>

            <!-- Status Bar Atas -->
            <div class="h-8 px-6 flex justify-between items-center text-xs text-zinc-300 z-50 bg-black/40 relative">
                <span x-text="currentTime" class="font-medium text-[11px] tracking-tight">07:45</span>
                
                <div class="flex space-x-2.5 items-center">
                    <span class="text-[10px] text-zinc-300 font-semibold tracking-wider">5G</span>
                    <div class="battery-pill" title="Battery 100%">
                        <div class="battery-level"></div>
                    </div>
                </div>
            </div>

            <!-- Main Workspace Area -->
            <div class="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-br from-zinc-900 via-indigo-950 to-black">
                
                <!-- 1. LOCKSCREEN / GUEST QUEST -->
                <div x-show="currentScreen === 'lockscreen'" 
                     class="absolute inset-0 flex flex-col justify-between p-6 text-center z-40 bg-black/60 backdrop-blur-md">
                    
                    <div class="mt-12 space-y-2">
                        <h1 class="text-5xl font-extralight tracking-tight" x-text="currentTime">07:45</h1>
                        <p class="text-xs text-indigo-300 font-medium tracking-wide">ZeroOS v1.0 • Guest Mode</p>
                    </div>

                    <div class="space-y-6 mb-8">
                        <div class="w-20 h-20 bg-indigo-500/20 border border-indigo-400/30 rounded-3xl mx-auto flex items-center justify-center text-3xl shadow-lg shadow-indigo-500/10">
                            ⚡
                        </div>
                        <div>
                            <h2 class="text-lg font-bold">Selamat Datang!</h2>
                            <p class="text-xs text-zinc-400 mt-1 px-4">Mulai Quest untuk menjelajahi lingkungan sistem ZeroOS.</p>
                        </div>
                        <button @click="currentScreen = 'desktop'" 
                                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-2xl transition shadow-lg shadow-indigo-600/30 active:scale-95">
                            Mulai Guest Quest 🚀
                        </button>
                    </div>
                </div>

                <!-- 2. DESKTOP / HOME SCREEN -->
                <div x-show="currentScreen === 'desktop'" 
                     class="w-full h-full p-6 flex flex-col justify-between relative">
                    
                    <!-- Greeting Header -->
                    <div class="text-left mt-2">
                        <p class="text-xs text-indigo-400 font-semibold tracking-wider">GUEST WORKSPACE</p>
                        <h2 class="text-xl font-bold">ZeroOS Apps</h2>
                    </div>

                    <!-- App Grid -->
                    <div class="grid grid-cols-4 gap-4 my-auto">
                        <!-- Notes App -->
                        <div @click="openApp('notes')" class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                            <div class="w-14 h-14 bg-zinc-800/80 group-hover:bg-indigo-600 border border-zinc-700/50 rounded-2xl flex items-center justify-center text-2xl transition duration-200 shadow-md group-active:scale-90">
                                📝
                            </div>
                            <span class="text-[11px] text-zinc-300 font-medium">Notes</span>
                        </div>

                        <!-- Settings App -->
                        <div @click="openApp('settings')" class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                            <div class="w-14 h-14 bg-zinc-800/80 group-hover:bg-indigo-600 border border-zinc-700/50 rounded-2xl flex items-center justify-center text-2xl transition duration-200 shadow-md group-active:scale-90">
                                ⚙️
                            </div>
                            <span class="text-[11px] text-zinc-300 font-medium">Settings</span>
                        </div>

                        <!-- Terminal App -->
                        <div @click="openApp('terminal')" class="flex flex-col items-center space-y-1.5 cursor-pointer group">
                            <div class="w-14 h-14 bg-zinc-800/80 group-hover:bg-indigo-600 border border-zinc-700/50 rounded-2xl flex items-center justify-center text-2xl transition duration-200 shadow-md group-active:scale-90">
                                💻
                            </div>
                            <span class="text-[11px] text-zinc-300 font-medium">Terminal</span>
                        </div>
                    </div>

                    <!-- Lock Button -->
                    <div class="text-center mb-2">
                        <button @click="currentScreen = 'lockscreen'" class="text-xs text-zinc-500 hover:text-zinc-300 transition">
                            🔒 Lock Device
                        </button>
                    </div>
                </div>

                <!-- 3. APPLICATION WINDOW MODALS -->

                <!-- Notes App Window -->
                <div x-show="apps.notes.isOpen" 
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95 translate-y-4"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     :style="'z-index: ' + apps.notes.zIndex"
                     @mousedown="focusApp('notes')"
                     class="absolute inset-x-2 top-2 bottom-2 bg-zinc-900/95 border border-zinc-700/70 rounded-3xl shadow-2xl flex flex-col overflow-hidden backdrop-blur-xl">
                    
                    <!-- Window Header -->
                    <div class="h-10 bg-zinc-800/80 px-4 flex justify-between items-center border-b border-zinc-700/50">
                        <span class="text-xs font-semibold flex items-center gap-1.5">📝 Notes</span>
                        <button @click="closeApp('notes')" class="w-6 h-6 rounded-full bg-zinc-700/50 hover:bg-red-500/80 flex items-center justify-center text-xs transition">✕</button>
                    </div>
                    <!-- Window Body -->
                    <div class="flex-1 p-4 overflow-y-auto text-xs text-zinc-300 space-y-3">
                        <p class="font-semibold text-indigo-400">Guest Note #1</p>
                        <textarea class="w-full h-40 bg-zinc-950/60 border border-zinc-800 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500 text-zinc-200" placeholder="Tulis catatan cepat kamu di sini..."></textarea>
                    </div>
                </div>

                <!-- Settings App Window -->
                <div x-show="apps.settings.isOpen" 
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95 translate-y-4"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     :style="'z-index: ' + apps.settings.zIndex"
                     @mousedown="focusApp('settings')"
                     class="absolute inset-x-2 top-2 bottom-2 bg-zinc-900/95 border border-zinc-700/70 rounded-3xl shadow-2xl flex flex-col overflow-hidden backdrop-blur-xl">
                    
                    <div class="h-10 bg-zinc-800/80 px-4 flex justify-between items-center border-b border-zinc-700/50">
                        <span class="text-xs font-semibold flex items-center gap-1.5">⚙️ Settings</span>
                        <button @click="closeApp('settings')" class="w-6 h-6 rounded-full bg-zinc-700/50 hover:bg-red-500/80 flex items-center justify-center text-xs transition">✕</button>
                    </div>
                    <div class="flex-1 p-4 text-xs text-zinc-300 space-y-4">
                        <div class="p-3 bg-zinc-800/40 rounded-xl border border-zinc-700/40">
                            <p class="font-semibold">Mode User</p>
                            <p class="text-[10px] text-zinc-400 mt-0.5">Saat ini: Guest Mode</p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Bottom Home Bar Indicator -->
            <div class="h-5 bg-black/40 flex justify-center items-center z-50">
                <div class="w-28 h-1 bg-zinc-600/80 rounded-full cursor-pointer hover:bg-zinc-400 transition" @click="activeApp ? closeApp(activeApp) : null"></div>
            </div>

        </div>

    </div>

</body>
</html>
